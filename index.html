<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keystroke Recorder with Playback</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .data-display, .playback-display {
      padding: 10px;
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .timestamp {
      color: #888;
      font-size: 14px;
    }
    button {
      padding: 10px 15px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:disabled {
      background: #cccccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Keystroke Recorder with Playback</h1>
    <textarea id="textBox" placeholder="Type something..."></textarea>
    <div id="dataDisplay" class="data-display">
      <h3>Recorded Keystrokes</h3>
      <ul id="dataList">
        <li>No keystrokes recorded yet...</li>
      </ul>
    </div>
    <button id="playbackButton" disabled>Play Recorded Keystrokes</button>
    <div id="playbackDisplay" class="playback-display">
      <h3>Playback</h3>
      <p id="playbackText">No playback yet...</p>
    </div>
  </div>

  <script>
    const textBox = document.getElementById('textBox');
    const dataDisplay = document.getElementById('dataList');
    const playbackButton = document.getElementById('playbackButton');
    const playbackText = document.getElementById('playbackText');

    let keystrokes = [];

    // Record each keystroke with a timestamp
    textBox.addEventListener('input', (event) => {
      const currentText = textBox.value;
      const timestamp = new Date().toLocaleTimeString();
      keystrokes.push({ text: currentText, timestamp });
      updateDataDisplay();
      playbackButton.disabled = false;
    });

    // Update the recorded keystrokes display
    function updateDataDisplay() {
      dataDisplay.innerHTML = "";
      keystrokes.forEach((item, index) => {
        const listItem = document.createElement('li');
        listItem.innerHTML = `<strong>${item.text}</strong> <span class="timestamp">(Recorded at: ${item.timestamp})</span>`;
        dataDisplay.appendChild(listItem);
      });
    }

    // Play back the recorded keystrokes with timestamps
    playbackButton.addEventListener('click', () => {
      playbackText.innerHTML = "Playing back recorded keystrokes...";
      let index = 0;

      function displayNext() {
        if (index < keystrokes.length) {
          const item = keystrokes[index];
          playbackText.innerHTML = `<strong>${item.text}</strong> <span class="timestamp">(Recorded at: ${item.timestamp})</span>`;
          index++;
          setTimeout(displayNext, 500); // Play each keystroke every 500ms
        } else {
          playbackText.innerHTML = "Playback completed!";
        }
      }

      displayNext();
    });
  </script>
</body>
</html>
