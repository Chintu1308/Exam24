<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keystroke Recorder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .playback-display {
      padding: 10px;
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:disabled {
      background: #cccccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Keystroke Recorder</h1>
    <textarea id="textBox" placeholder="Type something..."></textarea>
    <button id="playbackButton" disabled>Play Recorded Keystrokes</button>
    <button id="downloadButton" disabled>Download JSON</button>
    <div id="playbackDisplay" class="playback-display">
      <h3>Playback</h3>
      <p id="playbackText">No playback yet...</p>
    </div>
  </div>

  <script>
    const textBox = document.getElementById('textBox');
    const playbackButton = document.getElementById('playbackButton');
    const downloadButton = document.getElementById('downloadButton');
    const playbackText = document.getElementById('playbackText');

    let keystrokes = [];

    // Record each keystroke with a timestamp
    textBox.addEventListener('input', () => {
      const currentText = textBox.value;
      const timestamp = new Date().toISOString();
      keystrokes.push({ text: currentText, timestamp });
      playbackButton.disabled = false;
      downloadButton.disabled = false;
    });

    // Play back the recorded keystrokes
    playbackButton.addEventListener('click', () => {
      playbackText.innerHTML = "Playing back recorded keystrokes...";
      let index = 0;

      function displayNext() {
        if (index < keystrokes.length) {
          const item = keystrokes[index];
          playbackText.innerHTML = `<strong>${item.text}</strong>`;
          index++;
          setTimeout(displayNext, 500); // Play each keystroke every 500ms
        } else {
          playbackText.innerHTML = `<strong>${keystrokes[keystrokes.length - 1].text}</strong>`;
        }
      }

      displayNext();
    });

    // Download the JSON file containing keystrokes
    downloadButton.addEventListener('click', () => {
      const jsonData = JSON.stringify(keystrokes, null, 2);
      const blob = new Blob([jsonData], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = 'keystrokes.json';
      link.click();

      URL.revokeObjectURL(url); // Clean up the URL
    });
  </script>
</body>
</html>
